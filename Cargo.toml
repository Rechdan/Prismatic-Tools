[package]
name = "primatic-tools"
version = "0.1.0"
edition = "2024"

[dependencies]

# Windows-only deps. Gated on cfg(windows) so the Linux host build (`cargo build`,
# `cargo test`, `yarn dev`) still compiles the stub `main`, while the real product
# builds with `--target x86_64-pc-windows-gnu` (where cfg(windows) is true).
# windows-reactor is not published to crates.io; pull it from the windows-rs repo.
[target.'cfg(windows)'.dependencies]
windows-reactor = { git = "https://github.com/microsoft/windows-rs" }
tray-icon = "0.19"
# Lua runtime for widgets (widget-runtime). `vendored` bundles Lua 5.4's C source
# so there is no system-Lua dependency; the C is cross-compiled by the mingw
# toolchain for the gnu target. Owned/'static handles (mlua ≥0.9) let a Lua
# `Function` be captured directly in reactor's `Fn() + 'static` on_click closures.
mlua = { version = "0.10", features = ["lua54", "vendored"] }
# Widget manifest (`widget.toml`) parsing. Pure Rust, cross-builds cleanly; parsed
# via `toml::Table` (no serde derive needed for three fields).
toml = "0.8"
# Markdown parser for the README home screen (home-screen). Pure Rust, cross-builds
# cleanly for the gnu target. `default-features = false` drops the unused `html`
# render feature — we consume the pull-parser event stream directly. Only block
# events are mapped; inline runs are flattened to text (reactor renders no per-run
# inline styling — see docs/reactor-notes.md).
pulldown-cmark = { version = "0.12", default-features = false }
# Win32 show/hide for the tray↔window toggle. Reactor's own AppWindow bindings
# are pub(crate), so drive visibility through the top-level HWND instead.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # CreateMutexW (Threading) takes a SECURITY_ATTRIBUTES* — windows-sys gates the
    # fn behind Win32_Security too, so both are required for the single-instance guard.
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# windows-reactor catches panics at FFI boundaries, but the global default must
# still be abort: unwinding through WinUI 3's C++ frames is undefined behavior.
[profile.release]
panic = "abort"
