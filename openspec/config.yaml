schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  Prismatic Tools: a Windows 11 system-tray desktop app that opens a WinUI 3
  window (Mica backdrop, OS-matched light/dark) hosting individual tools. Built
  on the pure-Rust `windows-reactor` crate — declarative WinUI 3, no XAML.

  Stack & build:
  - Rust 1.96.0 (channel pinned in `rust-toolchain.toml`), edition 2024 (in
    `Cargo.toml`). The product is
    `cfg(windows)`-only and is cross-built for
    `x86_64-pc-windows-gnu` from a WSL2 Linux host via `scripts/winrun.py`
    (no Visual Studio / MSVC). Plain `cargo build`/`cargo run` on Linux compiles
    only a stub `main` — it does not produce the app.
  - Windows deps live under `[target.'cfg(windows)'.dependencies]`:
    `windows-reactor` (git), `tray-icon`, `windows-sys`, `mlua`
    (`lua54`+`vendored` — the Lua widget runtime), `toml` (widget manifests), and
    `pulldown-cmark` (`default-features = false` — the README home-screen markdown parser).
  - Release builds require `[profile.release] panic = "abort"` (unwinding into
    WinUI's C++ frames is UB).
  - There are no tests. Node tooling (nodemon, `concurrently`, `@fission-ai/openspec`)
    is dev-only; there is no JavaScript application code.

  Architecture (thin Rust modules, all `cfg(windows)`-gated):
  - `src/shell.rs` — single-instance guard (named mutex), tray presence, and the
    tool-rendering surface: a single left navigation sidebar beside a right
    container, inset from the window edge via a margin, with no header row. The
    window body is a two-pane grid — a fixed 200-DIP nav column + a star-sized right
    container. The nav column is a three-row layout: a pinned app-title label
    (`Prismatic Tools`) on top; a scrollable middle holding an accessible `Home`
    entry, a `Tools` heading, and the loaded widget as a full-width clickable card;
    and a pinned bottom group holding a `Configs` entry and a `GitHub` repo-link. The
    right container shows one of three views — the README home view (default), the
    active widget, or a config view. The nav card is a tapped `border` rendering the
    widget's optional custom preview or, by default, its name, layering a persistent
    `ControlFill` selection fill (lit when the widget view is active) beneath a
    `SubtleFill` hover fill, both animated via opacity crossfade. Active-view
    selection (a `View { Home, Widget, Config }` state, default `Home`): the nav
    `Configs` entry activates the config view, the nav `Home` entry activates the
    home view, and the nav card's `on_tapped` activates the widget view (not a
    toggle); the active entry carries a soft selection highlight. The two-pane
    sidebar layout is the `main-content-layout` capability
    (`openspec/specs/main-content-layout/`); the README home view is the
    `home-screen` capability (`openspec/specs/home-screen/`).
  - `src/home.rs` — the `Home` view (the shell's default). Renders the project
    `README.md`, bundled into the exe via `include_str!` (a compile input — an edit
    needs a rebuild), as block-level markdown parsed by `pulldown-cmark`; inline
    runs are flattened to text (reactor renders no per-run inline styling / inline
    links), and the document is wrapped in a vertical `scroll_viewer`. Fault-tolerant
    (bad markdown degrades to text). Capability `openspec/specs/home-screen/`.
  - `src/window.rs` — the themed `windows-reactor` window plus Win32 HWND
    show/hide/toggle, and a 1024×768-DIP initial (opening) size (`App::inner_size`)
    plus a matching 1024×768-DIP minimum size (reactor's `App::inner_constraints`
    builder, not a Win32 subclass). A startup CBT hook claims the window at creation
    and suppresses its first show (flash-free launch); the HWND subclass both holds
    that suppression and turns `WM_CLOSE` into hide-to-tray.
  - `src/widget/` — the Lua widget runtime. `package.rs` resolves the first widget
    folder in `widgets/` (beside the exe; `widget.toml` manifest, folder name = id)
    and reads its Lua entry (its count backs the public `widget::count()` used
    for the reload label);
    `runtime.rs` runs it in a sandboxed `mlua` VM (safe libs only — no os/io/debug;
    `require` scoped to the widget folder) enforcing the `{ state, render, nav? }`
    contract — `nav(state)` is an optional display-only preview for the nav card,
    sharing the same `state` as `render` — and mapping the declarative UI table
    (`vstack`/`hstack`/`text`/`button`/`border`) onto reactor elements. The config
    view hosts a `Reload widget(s)` action (reloads from disk, resets in-memory
    state). Capabilities `openspec/specs/widget-package/` + `widget-runtime/`.

  Tray-resident lifecycle: starts hidden, the tray toggles the window, the
  title-bar X hides to tray (does not exit), a single-instance mutex drops
  duplicate launches, and only the tray "Exit" item terminates.

  Note: the Cargo crate name is `primatic-tools` (missing the first "s"); the npm
  package is `prismatic-tools`. Keep both as-is unless asked to rename.

  Reactor API + cross-build gotchas — clickable containers via `ElementExt::on_tapped`
  (reactor's clickable widgets take string content only), opacity-only transitions
  (no brush-color tween), theme-aware `ThemeRef` brushes, and typechecking the
  `cfg(windows)` UI code via `cargo check --target x86_64-pc-windows-gnu` (the Linux
  stub does not compile it) — are captured in `docs/reactor-notes.md`.

# Per-artifact rules — custom rules for specific artifacts.
rules:
  proposal:
    - State whether the change touches Windows-only (`cfg(windows)`) code, the
      cross-build/staging path (`scripts/winrun.py`), or the dev-only Node layer.
    - Include a "Non-goals" section.
  tasks:
    - Keep the Linux host stub building green (`cargo build`/`cargo test`); never
      assume a Windows build host.
    - Note when a task can only be verified on Windows via `python3 scripts/winrun.py`.
